[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbeast"
version = "0.2.0"
description = "Centro de control para portátiles gaming en Linux: temperaturas, ventiladores, modos, batería, luces y perfiles por juego"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "bernaljeanp" }]
keywords = ["linux", "laptop", "gaming", "fan-control", "rgb", "alienware", "kde"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
# La distro suele aportar PySide6 (python3-pyside6 / pyside6); con pip se instala esta.
# Con pip se usa PySide6 >= 6.12 (los shaders del repositorio se compilan con esa versión);
# los paquetes de distro recompilan los shaders con su propio Qt.
dependencies = ["PySide6-Essentials>=6.12"]

[project.urls]
Homepage = "https://github.com/bernaljeanp/rgbeast"
Issues = "https://github.com/bernaljeanp/rgbeast/issues"

[project.scripts]
rgbeast = "rgbeast.app:main"
rgbeast-agent = "rgbeast.agent:main"

[tool.setuptools]
# qml/, fonts/, shaders/ e i18n/ son solo datos, pero setuptools quiere verlas declaradas.
packages = ["rgbeast", "rgbeast.qml", "rgbeast.fonts", "rgbeast.shaders", "rgbeast.i18n"]

[tool.setuptools.package-data]
"rgbeast.qml" = ["*"]
"rgbeast.fonts" = ["*"]
"rgbeast.shaders" = ["*"]
"rgbeast.i18n" = ["*.qm"]
